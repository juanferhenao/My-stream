<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 1. Main Player Engine (DO NOT CHANGE) -->
  <script src="https://jsdelivr.net"></script>
  <!-- 2. HLS Live Stream Engine Plugin (DO NOT CHANGE) -->
  <script src="https://jsdelivr.net"></script>
</head>
<body style="margin:0; padding:0; background:#000; overflow:hidden;">
  <div id="player" style="width:100vw; height:100vh;"></div>
  <script>
    var player = new Clappr.Player({
      // 3. YOUR WORKING LIVE STREAM LINK GOES HERE
      source: "https://tubi.io",
      parentId: "#player",
      plugins: [HlsjsPlayback],
      playback: {
        hlsjsConfig: {
          enableWorker: true
        }
      },
      autoPlay: true,
      mute: true,
      width: '100%',
      height: '100%'
    });
  </script>
</body>
</html>
